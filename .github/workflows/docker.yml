name: Publish Docker Image

on:
  push:
    branches: [ master ]
    tags:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/subconverter

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get commit SHA
        if: github.ref == 'refs/heads/master'
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and load
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64
          context: .
          file: scripts/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SHA=${{ steps.vars.outputs.sha_short }}
          load: true
          push: false

      - name: Set up regression test Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test REALITY ML-KEM conversion
        env:
          MIHOMO_TEST_BINARY: ${{ runner.temp }}/mihomo-validation
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          curl --fail --location --retry 3 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-compatible-v1.19.33.gz -o "$RUNNER_TEMP/mihomo-validation.gz"
          echo "386508bfb1c72c43b6a0eda73708ecdce82546581b0ebcb16366c53757c622b6  $RUNNER_TEMP/mihomo-validation.gz" | sha256sum --check
          gzip --decompress "$RUNNER_TEMP/mihomo-validation.gz"
          chmod +x "$MIHOMO_TEST_BINARY"
          python scripts/test_reality_mlkem.py --image "${GHCR_IMAGE}:sha-${GITHUB_SHA}"

      - name: Push tested images
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] || docker push "$tag"
          done <<< "$IMAGE_TAGS"
